apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vectorclusters.lifecycle.vectordb.dev
spec:
  group: lifecycle.vectordb.dev
  names:
    kind: VectorCluster
    listKind: VectorClusterList
    plural: vectorclusters
    singular: vectorcluster
    shortNames: [vc]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Version, type: string, jsonPath: .spec.version}
        - {name: Nodes, type: integer, jsonPath: .spec.nodes}
        - {name: Ready, type: integer, jsonPath: .status.readyNodes}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [version, nodes, replicationFactor]
              properties:
                version: {type: string, pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'}
                image: {type: string}
                nodes: {type: integer, minimum: 1, maximum: 64}
                replicationFactor: {type: integer, minimum: 1, maximum: 8}
                storageSize: {type: string}
                storageClassName: {type: string}
                backupEveryMinutes: {type: integer, minimum: 0}
                backupRetain: {type: integer, minimum: 0}
                dr:
                  type: object
                  required: [region]
                  properties:
                    region: {type: string}
              x-kubernetes-validations:
                - rule: self.replicationFactor <= self.nodes
                  message: replicationFactor cannot exceed nodes
            status:
              type: object
              properties:
                phase: {type: string}
                message: {type: string}
                lastActions: {type: array, items: {type: string}}
                observedGeneration: {type: integer, format: int64}
                readyNodes: {type: integer}
                peers:
                  type: object
                  additionalProperties: {type: integer, format: int64}
                nodes:
                  type: array
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      ordinal: {type: integer}
                      peer: {type: integer, format: int64}
                      version: {type: string}
                      ready: {type: boolean}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type: {type: string}
                      status: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
                      reason: {type: string}
                      message: {type: string}
