apiVersion: v1
kind: Namespace
metadata:
  name: vdb-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vdb-operator
  namespace: vdb-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vdb-operator
rules:
  - apiGroups: [lifecycle.vectordb.dev]
    resources: [vectorclusters, vectorclusters/status]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vdb-operator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: vdb-operator}
subjects:
  - {kind: ServiceAccount, name: vdb-operator, namespace: vdb-system}
